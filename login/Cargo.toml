[package]
name = "login"
version = "0.0.24"
edition = "2024"
license = "MIT"
description = "Peios /bin/login — a PGSS Logon originator for terminal sessions."
publish = false

[[bin]]
name = "login"
path = "src/main.rs"

[dependencies]
session-preferences = { path = "../session-preferences" }
auth-core = { path = "../auth-core" }
libc = "0.2"
# Terminal input, shared with `lps`: both must take a password from a terminal
# without echoing it, and the termios guard that restores echo afterwards is
# exactly the sort of thing that should exist once.
terminal-input = { path = "../terminal-input" }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "4c9c0106550e3b7d8b4a98dfd0d7a5490fcf0116" }
