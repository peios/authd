[package]
name = "login"
version = "0.0.22"
edition = "2024"
license = "MIT"
description = "Peios /bin/login — a PGSS Logon originator for terminal sessions."
publish = false

[[bin]]
name = "login"
path = "src/main.rs"

[dependencies]
libsession = { path = "../libsession" }
libauthd = { path = "../libauthd" }
libc = "0.2"
# Terminal input, shared with `lps`: both must take a password from a terminal
# without echoing it, and the termios guard that restores echo afterwards is
# exactly the sort of thing that should exist once.
libtty = { path = "../libtty" }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "fa833541e1837042765072f092140f4af683edc2" }
