[package]
name = "authd"
version = "0.0.24"
edition = "2024"
license = "MIT"
description = "Peios' authentication daemon — the PGSS Logon authority."
publish = false

[[bin]]
name = "authd"
path = "src/main.rs"

[[bin]]
name = "authn-probe"
path = "tests/native/authn-probe.rs"

# authd runs at PeiosTcb holding SeCreateTokenPrivilege. Dependencies here are
# dependencies of the most privileged userspace process on the system, so the
# list stays short and every addition needs a reason.
[dependencies]
auth-core = { path = "../auth-core" }
# authd's own policy reading, its well-known principals and the derivation
# of a service's SID (which is how a principal source is identified), lifted
# out so a window saying what a principal gets reads them as authd does.
# Without its `write` feature it opens no key for writing.
auth-policy = { path = "../auth-policy" }
libc = "0.2"
peios = { git = "https://github.com/peios/peios-rs.git", rev = "3950d35950c46cb3538885b7cf05bde059393def" }
# The access-list API takes the SDK's object-type entries. This exposes the
# already-linked SDK ABI types; it adds no second access-check implementation.
peios-sys = { git = "https://github.com/peios/peios-rs.git", rev = "3950d35950c46cb3538885b7cf05bde059393def" }
