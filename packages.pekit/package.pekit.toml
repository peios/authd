# Base metadata shared by every package carved from the authd build tree.
#
# Five packages come out of one build.main, and the split is deliberate rather
# than cosmetic — it mirrors five trust domains:
#
#   authd      Mainline's PGSS Logon *authority*. Mints, cannot verify.
#   lpsd       a *principal source*. Verifies, cannot mint.
#   lps        lpsd's *administration tool*. Neither; it asks, over a socket.
#   login      a PGSS Logon *client*. Neither; it collects.
#   nss-peios  a PGSS Logon *identity client*, loaded into every process.
#
# A machine could run a different authority and keep this login, a different
# logon originator against this authd, or an entirely different principal source
# behind it. Shipping them as one package would make that story false at the
# packaging layer.
#
# nss-peios is the sharpest case for the split rather than the softest. It is
# the only thing here that ends up mapped into every address space on the
# system, so an image that wants an authority without that reach must be able to
# say so by not installing a package.

# -11: drop the temporary BUILTIN\Administrators membership from every
# attested service token (PEI-547). It existed only because a service could
# reach no part of the filesystem: one inheritable ACL granted SYSTEM and
# Administrators alone, and propagated through KACS's missing-SD synthesis into
# the whole tree (PEI-546). With the root and phase-1 descriptors now granting
# Everyone read and execute, a service reaches what it needs as itself. The
# revert is the point: privileges union across a token's SIDs, so that ACE was
# not granting filesystem access but the entire Administrators policy record --
# SeLoadDriverPrivilege, SeRestorePrivilege, SeManageVolumePrivilege,
# SeSecurityPrivilege and High integrity, on a DNS parser reading from a
# network socket, invisibly, because svctl reports the declared identity.

format = "peipkg"

[package]
version      = "{{version}}-11"
architecture = "x86_64"
license      = "MIT"
