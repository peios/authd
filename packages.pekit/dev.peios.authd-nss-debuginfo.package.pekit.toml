[package]
name        = "dev.peios.authd-nss-debuginfo"
description = "Peios NSS principal-resolution module debugging symbols"
# The same crate closure and static unwinder as the module; checked by build.main.
license     = "(Apache-2.0 OR MIT) AND MIT AND (GPL-3.0-or-later WITH GCC-exception-3.1)"

[dependencies]
"dev.peios.authd-nss" = "= {{release}}"

[files]
"@source:LICENSE"               = "usr/share/licenses/dev.peios.authd-nss-debuginfo/LICENSE"
":licenses/nss/**"              = "usr/share/licenses/dev.peios.authd-nss-debuginfo/third-party"
":debug/nss/usr/lib/debug/**"   = "usr/lib/debug"
