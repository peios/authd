[package]
name        = "dev.peios.authd-lpsd-debuginfo"
description = "Peios local principal source daemon debugging symbols"
# The same crate closure as lpsd; checked by build.main.
license     = "((MIT OR Apache-2.0) AND Unicode-3.0) AND Apache-2.0 AND (Apache-2.0 OR MIT) AND BSD-3-Clause AND ISC AND MIT AND (MIT OR Unlicense)"

[dependencies]
"dev.peios.authd-lpsd" = "= {{release}}"

[files]
"@source:LICENSE"                = "usr/share/licenses/dev.peios.authd-lpsd-debuginfo/LICENSE"
":licenses/lpsd/**"              = "usr/share/licenses/dev.peios.authd-lpsd-debuginfo/third-party"
":debug/lpsd/usr/lib/debug/**"   = "usr/lib/debug"
