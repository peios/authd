# login — Peios' /bin/login, a PGSS Logon originator for terminal sessions.
#
# Deliberately carries NO package dependency on authd. What it needs at runtime
# is *an* authority listening on /run/logon.sock, which is a protocol contract
# rather than a package one — and expressing it as `Requires: authd` would
# assert exactly the coupling PGSS Logon exists to avoid.
#
# Ordering at boot is peinit's job (the compiled-in login service `requires`
# authd), not the package manager's.

[package]
description = "Peios login - a PGSS Logon originator for terminal sessions"

[files]
":usr/bin/login" = "usr/bin/login"
# A login prompt on the system console, as registry data. peinit used to carry
# this compiled-in and inject it from `peios.login=1`; it does not any more, so
# the definition ships with the program it starts.
#
# Named for the pairing, not the program: login is a terminal logon originator,
# and which terminal is the image's choice. A prompt on another tty is another
# seed with another TTYPath — which is why TTYPath carries a path rather than a
# boolean. Inert until an image names it in `[registry] autoapply`.
":usr/share/regim/login-console.reg" = "usr/share/regim/login-console.reg"
