# authd — Peios' authentication daemon, and Mainline's implementation of the
# PGSS Logon authority.
#
# Runs at PeiosTcb holding SeCreateTokenPrivilege and SeTcbPrivilege: the only
# general-purpose minter of identity on a running system. Listens on
# /run/logon.sock.
#
# Runtime library dependencies (libpeios, glibc) are derived from the binary's
# DT_NEEDED entries.

[package]
description = "Peios authentication daemon - the PGSS Logon authority"

[files]
":usr/sbin/authd" = "usr/sbin/authd"
# The default local policy: which privileges and integrity level each principal
# gets. Travels with authd rather than with lpsd because it is authd that reads
# it, and it describes what a logon *means* rather than anything about who holds
# the accounts — a machine with a directory source and no lpsd still wants it.
#
# Inert on its own, like every seed here: it lands in the vendor seed library,
# and only an image that names it in `[registry] autoapply` stages it into the
# queue peinit drains on first boot.
#
# One thing separates it from the lpsd seeds, and it is worth knowing before an
# image opts in. authd treats the policy key as the WHOLE answer whenever it
# exists — the compiled floor applies only when the key is absent entirely — so
# applying this file means adopting these defaults in full. A hardened image
# ships its own file in place of it rather than editing around it.
":usr/share/regim/authd-policy.reg" = "usr/share/regim/authd-policy.reg"
# The service definition: what peinit starts, and the readiness contract that
# lets lpsd order after it. Here because peinit no longer carries a compiled-in
# authd definition — registryd is the only service it still defines itself.
# Inert like the policy seed above until an image opts in.
":usr/share/regim/authd-service.reg" = "usr/share/regim/authd-service.reg"
