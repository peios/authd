# The PGSS Logon authority. It can mint identity and deliberately contains no
# credential verifier or session launcher.
side_effects = ["man-db"]

[package]
name         = "dev.peios.authd"
description  = "Peios authentication authority - the PGSS Logon authority"
license      = "((MIT OR Apache-2.0) AND Unicode-3.0) AND Apache-2.0 AND (Apache-2.0 OR MIT) AND BSD-3-Clause AND ISC AND MIT AND (MIT OR Unlicense)"



[files]
"@source:LICENSE"                      = "usr/share/licenses/dev.peios.authd/LICENSE"
":licenses/authd/**"                   = "usr/share/licenses/dev.peios.authd/third-party"
":usr/sbin/authd"                       = "usr/sbin/authd"
":usr/share/man/man8/authd.8.gz"        = "usr/share/man/man8/authd.8.gz"
":usr/share/regim/authd-policy.reg"     = "usr/share/regim/authd-policy.reg"
":usr/share/regim/authd-service.reg"    = "usr/share/regim/authd-service.reg"
# regman documentation for the two registry roots authd owns: the logon policy
# under Generic, and its own principal-source allowlist. The seed above puts
# values in the registry; this is what explains what one means. Hand-written
# beside the recipe, so it comes from source with no build target involved.
"@source:authd.regman"                  = "usr/share/regman/authd.regman"
