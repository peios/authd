# libnss_peios.so.2 — how a POSIX program sees a Peios principal.
#
# The one thing here that is loaded into *every* process on the system, which is
# why it is its own package rather than part of authd's.
#
# **This is not an opt-in.** Peios' glibc is patched so that the identity
# databases — passwd, group, shadow, initgroups — are not configurable and reach
# this module and nothing else (pkgs/glibc/patches/nss). There is no
# nsswitch.conf line to write and no `files` behind it, because there is no
# /etc/passwd: uid 0 is a projection of the SYSTEM token rather than an account.
#
# So an image that installs the patched glibc and not this package has a system
# where no name resolves at all. They belong together, and the packaging says so
# nowhere — a `Requires:` on glibc would be backwards, and one on authd would
# assert exactly the coupling PGSS Logon exists to avoid, since what this needs
# at runtime is *an* authority on /run/ident.sock rather than that one.
#
# Adding a source of identity to a Peios machine means writing a principal
# source: a separate process the authority confines to a domain and a numeric
# range, which cannot mint. It does not mean writing one of these.

[package]
description = "Peios NSS module - resolves principals through the authority"

[files]
":usr/lib/x86_64-linux-peios/libnss_peios.so.2" = "usr/lib/x86_64-linux-peios/libnss_peios.so.2"
