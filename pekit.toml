# authd — Peios's authentication authority and the independently deployable
# programs around it. One hermetic build produces trust-domain packages for
# the authority, local principal source, administration client, login client,
# NSS client, and the explicitly optional live-image account bootstrap.

out_dir = "out"

[source_package]
name = "dev.peios.authd-source"

[build.vendor]
command = '''
set -eu
SRC=$(pwd -P)
export CARGO_HOME=/tmp/cargo
export CARGO_NET_GIT_FETCH_WITH_CLI=true
mkdir -p "$CARGO_HOME" "$PEKIT_OUT"
cd "$SRC"
cargo vendor --locked "$PEKIT_OUT/vendor" > "$PEKIT_OUT/cargo-config.toml"
test -s "$PEKIT_OUT/cargo-config.toml"
test -n "$(find "$PEKIT_OUT/vendor" -mindepth 1 -maxdepth 1 -type d -print -quit)"

. tools/pekit-bazel.sh
prepare_native_sdk
# Acquisition is the only networked phase. Preserve a verified Bazel executable
# and a complete external-repository snapshot for the offline workers.
export XDG_CACHE_HOME="$PEKIT_OUT/tool-cache"
./bazel --batch --output_base="$PEKIT_OUT/bazel-output" vendor \
  --config=peios --vendor_dir="$PEKIT_OUT/bazel-vendor" //...
python3 tools/bazel-vendor.py freeze "$PEKIT_OUT/bazel-vendor"
mkdir -p "$PEKIT_OUT/tools"
cp "$XDG_CACHE_HOME/peios/bazel/$(cat .bazelversion)/bazel" "$PEKIT_OUT/tools/bazel"
cp MODULE.bazel.lock "$PEKIT_OUT/MODULE.bazel.lock"


'''

[build.vendor.dependencies.peipkg]
"org.rust-lang.rust" = ">= 1.98.1"
# Cargo fetches the pinned Git dependencies through the git CLI.
"com.git-scm.git"    = ">= 2.55.0"
"dev.peios.peiosutils" = "*"
"org.gnu.findutils"  = "*"

"org.gnu.bash" = "*"
"org.gnu.tar" = "*"
"se.curl.curl" = "*"
"org.pkgconf.pkgconf" = "*"
"org.gnu.binutils" = "*"
"org.gnu.grep" = "*"
"org.gnu.sed" = "*"
"org.gnu.gzip" = "*"
"org.llvm.clang" = ">= 22"
"dev.peios.libpeios-devel" = ">= 0.5.8"
"dev.peios.kernel-headers" = "*"

[build.main]
needs = ["vendor"]
command = '''
set -eu
set -o pipefail 2>/dev/null || true

SRC=$(pwd -P)
export CARGO_HOME="$PEKIT_OUT/cargo-home"
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"

for tool in cargo rustc gcc bash tar pkg-config python3 objcopy strip readelf debugedit; do
  command -v "$tool" >/dev/null || {
    echo "authd: missing required build tool: $tool" >&2
    exit 1
  }
done

# Production builds consume the packaged C ABI and an exact public peios-rs
# revision. No sibling checkout or mutable Cargo cache is visible here.
unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI
# A newer API-compatible libpeios SDK is valid; a different SONAME ABI is not.
pkg-config --atleast-version=0.5.8 peios || {
  echo "authd: dev.peios.libpeios-devel >= 0.5.8 (ABI 0) is required" >&2
  exit 1
}
readelf -dW "$(pkg-config --variable=libdir peios)/libpeios.so" |
  grep -E '\(SONAME\).*\[libpeios\.so\.0\]' >/dev/null
export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"

# A release tag and every workspace crate describe the same source family.
# Refuse a wrapper version that would create plausible but falsely versioned
# artifacts.
cargo metadata --locked --offline --no-deps --format-version 1 |
  python3 -c '
import json, os, pathlib, re, sys
metadata = json.load(sys.stdin)
members = set(metadata["workspace_members"])
versions = sorted({p["version"] for p in metadata["packages"] if p["id"] in members})
expected = os.environ["PEKIT_VERSION"]
bazel_version = re.search(r"^VERSION = \"([^\"]+)\"$", pathlib.Path("build/version.bzl").read_text(), re.M)
if not bazel_version or bazel_version.group(1) != expected:
    raise SystemExit("authd: Bazel source-family version does not match PEKIT_VERSION")
if versions != [expected]:
    raise SystemExit(f"authd: workspace versions {versions!r} do not equal package version {expected!r}")
'

. tools/pekit-bazel.sh
prepare_native_sdk
cp "$PEKIT_VENDOR_OUT/MODULE.bazel.lock" MODULE.bazel.lock
native_bazel build //:artifacts
BAZEL_BIN=$(native_bazel info bazel-bin)
BAZEL_EXECROOT=$(native_bazel info execution_root)
sh tools/install-auth-sdk.sh "$BAZEL_BIN/libauth" "$PEKIT_OUT"

# Each binary links its own crate closure, so each package ships that
# closure's notices and declares its conjunction of licences; the expression
# check below holds every package definition to it (PEI-1163). The debug
# sources cover all five closures. peios-rs carries no package-local notice; ship the reviewed
# notice of that same pinned source.
LICENSE_ROOT=$PEKIT_OUT/licenses
collect_licences() {
  out=$1
  roots=$2
  shift 2
  root_args=
  for root in $roots; do root_args="$root_args --root $root"; done
  for definition in "$@"; do
    # shellcheck disable=SC2086 # crate names are single words
    /usr/libexec/peios-packaging/collect-rust-licences \
      --licence-root "$LICENSE_ROOT/$out" $root_args \
      --notice "git+https://github.com/peios/peios-rs.git=third-party/peios-rs-LICENSE" \
      --expression-out "$LICENSE_ROOT/$out/crate-expression.txt"
    # The NSS cdylib also includes GCC's static unwinder, outside Cargo's graph.
    python3 - "$LICENSE_ROOT/$out/crate-expression.txt" "$out" \
      "packages.pekit/$definition.package.pekit.toml" <<'PY_LICENSE'
import pathlib, sys, tomllib
expected = pathlib.Path(sys.argv[1]).read_text().strip()
if sys.argv[2] == "nss":
    expected += " AND (GPL-3.0-or-later WITH GCC-exception-3.1)"
declared = tomllib.loads(pathlib.Path(sys.argv[3]).read_text())["package"]["license"]
if declared != expected:
    raise SystemExit(f"{sys.argv[3]}: license {declared!r}, expected {expected!r}")
PY_LICENSE
  done
  test -s "$LICENSE_ROOT/$out/crate-licenses.tsv"
}
collect_licences authd authd \
  dev.peios.authd dev.peios.authd-debuginfo
collect_licences lpsd lpsd \
  dev.peios.authd-lpsd dev.peios.authd-lpsd-debuginfo
collect_licences lps lps \
  dev.peios.authd-lps dev.peios.authd-lps-debuginfo
collect_licences login login \
  dev.peios.authd-login dev.peios.authd-login-debuginfo
collect_licences nss nss_peios \
  dev.peios.authd-nss dev.peios.authd-nss-debuginfo
mkdir -p "$LICENSE_ROOT/nss/libgcc"
cp third-party/libgcc-COPYING3 third-party/libgcc-COPYING.RUNTIME \
  "$LICENSE_ROOT/nss/libgcc/"
collect_licences libauth libauth \
  dev.peios.libauth dev.peios.libauth-debuginfo
collect_licences debugsource "authd lpsd lps login nss_peios libauth" \
  dev.peios.authd-debugsource

mkdir -p "$PEKIT_OUT/usr/sbin" "$PEKIT_OUT/usr/bin" "$PEKIT_OUT/var/state/lpsd"
cp "$BAZEL_BIN/authd/authd" "$PEKIT_OUT/usr/sbin/authd"
cp "$BAZEL_BIN/lpsd/lpsd" "$PEKIT_OUT/usr/sbin/lpsd"
cp "$BAZEL_BIN/login/login" "$PEKIT_OUT/usr/bin/login"
cp "$BAZEL_BIN/lps/lps" "$PEKIT_OUT/usr/bin/lps"
test -x "$PEKIT_OUT/usr/sbin/authd"
test -x "$PEKIT_OUT/usr/sbin/lpsd"
test -x "$PEKIT_OUT/usr/bin/login"
test -x "$PEKIT_OUT/usr/bin/lps"

# Install deterministic compressed manual pages. Keeping these beside the
# source makes each public executable self-documenting without depending on
# generated help output or a networked documentation build.
mkdir -p "$PEKIT_OUT/usr/share/man/man1" "$PEKIT_OUT/usr/share/man/man8"
gzip -n -9 -c "$SRC/man/lps.1" > "$PEKIT_OUT/usr/share/man/man1/lps.1.gz"
gzip -n -9 -c "$SRC/man/login.1" > "$PEKIT_OUT/usr/share/man/man1/login.1.gz"
gzip -n -9 -c "$SRC/man/authd.8" > "$PEKIT_OUT/usr/share/man/man8/authd.8.gz"
gzip -n -9 -c "$SRC/man/lpsd.8" > "$PEKIT_OUT/usr/share/man/man8/lpsd.8.gz"

# glibc loads this exact NSS ABI name from its configured triplet libdir.
mkdir -p "$PEKIT_OUT/usr/lib/x86_64-linux-peios"
cp "$BAZEL_BIN/nss/libnss_peios.so" \
  "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libnss_peios.so.2"
test -s "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libnss_peios.so.2"

# Registry seeds are inert vendor inputs. Keep the passwordless live-image
# bootstrap in its own package so the production principal source cannot
# introduce it merely by being installed.
mkdir -p "$PEKIT_OUT/usr/share/regim" "$PEKIT_OUT/usr/libexec/lpsd"
for seed in \
  lpsd-authd-registration.reg \
  authd-policy.reg \
  authd-service.reg \
  lpsd-service.reg \
  login-console.reg \
  lpsd-first-account.reg
do
  cp "$SRC/registry.d/$seed" "$PEKIT_OUT/usr/share/regim/$seed"
done
cp "$SRC/libexec/first-account" "$PEKIT_OUT/usr/libexec/lpsd/first-account"
test -x "$PEKIT_OUT/usr/libexec/lpsd/first-account"

# Split each independently installable ELF's symbols separately, while sharing
# one exact debug-source tree for the source release and vendored Rust closure.
# This stays local rather than using /usr/libexec/peios-packaging/split-debug:
# each component's symbols go to their own debuginfo package tree.
# Bazel's native toolchain maps source paths into the shared debug-source
# prefix. Resolve external crates and generated files through its execroot.
: > "$PEKIT_OUT/.debug-sources"
split_debug() {
  component=$1
  elf=$2
  list="$PEKIT_OUT/.debug-$component"
  debugedit -b "$SRC" -d /usr/src/debug/dev.peios.authd -l "$list" -n "$elf"
  cat "$list" >> "$PEKIT_OUT/.debug-sources"
  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  [ -n "$build_id" ] || {
    echo "authd: $elf has no build ID" >&2
    exit 1
  }
  first=$(printf %s "$build_id" | cut -c1-2)
  rest=$(printf %s "$build_id" | cut -c3-)
  debug="$PEKIT_OUT/debug/$component/usr/lib/debug/.build-id/$first/$rest.debug"
  mkdir -p "$(dirname "$debug")"
  objcopy --only-keep-debug "$elf" "$debug"
  strip --strip-unneeded "$elf"
  objcopy --add-gnu-debuglink="$debug" "$elf"
  rm -f "$list"
}

split_debug authd "$PEKIT_OUT/usr/sbin/authd"
split_debug lpsd "$PEKIT_OUT/usr/sbin/lpsd"
split_debug lps "$PEKIT_OUT/usr/bin/lps"
split_debug login "$PEKIT_OUT/usr/bin/login"
split_debug nss "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libnss_peios.so.2"
split_debug libauth "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libauth.so.1"

DEBUG_ROOT="$PEKIT_OUT/usr/src/debug/dev.peios.authd"
mkdir -p "$DEBUG_ROOT"
tr '\0' '\n' < "$PEKIT_OUT/.debug-sources" | LC_ALL=C sort -u | while IFS= read -r rel; do
  [ -n "$rel" ] || continue
  case "$rel" in */) continue ;; esac
  case "$rel" in
    external/*|bazel-out/*) origin="$BAZEL_EXECROOT/$rel" ;;
    vendor/*) origin="$PEKIT_VENDOR_OUT/$rel" ;;
    *)        origin="$SRC/$rel" ;;
  esac
  [ -f "$origin" ] || continue
  mkdir -p "$DEBUG_ROOT/$(dirname "$rel")"
  cp "$origin" "$DEBUG_ROOT/$rel"
done
rm -f "$PEKIT_OUT/.debug-sources"
test -n "$(find "$DEBUG_ROOT" -type f -print -quit)"

'''

# authd alone is part of the Peios trusted computing base: it holds the two
# privileges that mint identity. The tier is selected by the signing key.
[build.main.sign.pip]
"usr/sbin/authd" = "tcb.priv"

[build.main.dependencies.peipkg]
"org.gnu.bash" = "*"
"org.gnu.tar" = "*"
"org.git.kernel.dash"         = "*"
"dev.peios.peiosutils"        = "*"
"org.gnu.findutils"           = "*"
"org.gnu.grep"                = "*"
"org.gnu.sed"                 = "*"
"org.gnu.gzip"                = "*"
"org.rust-lang.rust"          = ">= 1.98.1"
"org.pkgconf.pkgconf"         = "*"
"org.gnu.binutils"            = "*"
"org.sourceware.debugedit"    = "*"
"org.python.python3"          = "*"
"org.llvm.clang"              = ">= 22"
"dev.peios.libpeios-devel"    = ">= 0.5.8"
"dev.peios.kernel-headers"    = "*"
"dev.peios.packaging-tools"   = "*"

[test]
gate = true
needs = ["main", "vendor"]
command = '''
set -eu
export CARGO_HOME="$PEKIT_OUT/cargo-home"
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"
unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI
# A newer API-compatible libpeios SDK is valid; a different SONAME ABI is not.
pkg-config --atleast-version=0.5.8 peios || {
  echo "authd: dev.peios.libpeios-devel >= 0.5.8 (ABI 0) is required" >&2
  exit 1
}
readelf -dW "$(pkg-config --variable=libdir peios)/libpeios.so" |
  grep -E '\(SONAME\).*\[libpeios\.so\.0\]' >/dev/null
export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"
. tools/pekit-bazel.sh
prepare_native_sdk
cp "$PEKIT_VENDOR_OUT/MODULE.bazel.lock" MODULE.bazel.lock
export PEIOS_AUTH_LIB_DIR="$PEKIT_MAIN_OUT/usr/lib/x86_64-linux-peios"
export LD_LIBRARY_PATH="$PEIOS_AUTH_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
native_bazel test //...
python3 tools/check-auth-abi.py "$PEIOS_AUTH_LIB_DIR"

# Validate the exact staged package output produced by build.main.
SRC=$(pwd -P)
PEKIT_OUT="$PEKIT_MAIN_OUT"
# Fail closed on distribution hardening, split-debug, and path-leak policy.
for record in \
  "authd:$PEKIT_OUT/usr/sbin/authd:exe" \
  "lpsd:$PEKIT_OUT/usr/sbin/lpsd:exe" \
  "lps:$PEKIT_OUT/usr/bin/lps:exe" \
  "login:$PEKIT_OUT/usr/bin/login:exe" \
  "nss:$PEKIT_OUT/usr/lib/x86_64-linux-peios/libnss_peios.so.2:dso" \
  "libauth:$PEKIT_OUT/usr/lib/x86_64-linux-peios/libauth.so.1:dso"
do
  component=${record%%:*}
  remain=${record#*:}
  elf=${remain%:*}
  kind=${record##*:}

  readelf -h "$elf" | grep -Eq 'Type:[[:space:]]+DYN'
  readelf -lW "$elf" | grep -q 'GNU_RELRO'
  readelf -n "$elf" | grep -Eq 'x86 feature:.*IBT.*SHSTK'
  readelf -lW "$elf" | grep -Eq 'GNU_STACK[[:space:]].*RW[[:space:]]'
  readelf -dW "$elf" | grep -q 'BIND_NOW'
  readelf -dW "$elf" | grep -q 'RELR'
  if readelf -dW "$elf" | grep -E '(RPATH|RUNPATH)' >/dev/null; then
    echo "authd: $elf carries an RPATH or RUNPATH" >&2
    exit 1
  fi
  if readelf -SW "$elf" | grep '\.debug_info' >/dev/null; then
    echo "authd: $elf still contains unsplit debug information" >&2
    exit 1
  fi
  if [ "$kind" = exe ]; then
    readelf -dW "$elf" | grep -Eq 'FLAGS_1.*PIE'
  else
    soname=libauth.so.1
    if [ "$component" = nss ]; then soname=libnss_peios.so.2; fi
    readelf -dW "$elf" | grep -F "[$soname]" >/dev/null
  fi

  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  debug="$PEKIT_OUT/debug/$component/usr/lib/debug/.build-id/$(printf %s "$build_id" | cut -c1-2)/$(printf %s "$build_id" | cut -c3-).debug"
  test -s "$debug"
  readelf -SW "$debug" | grep -q '\.debug_info'
  test "$(readelf -n "$debug" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)" = "$build_id"
  for forbidden in "$SRC" "$PEKIT_VENDOR_OUT" "$PEKIT_OUT_BASE" "$PEKIT_WORKSPACE_ROOT"; do
    if grep -aF "$forbidden" "$elf" "$debug" >/dev/null; then
      echo "authd: build path $forbidden leaked into $elf or its debug file" >&2
      exit 1
    fi
  done
done

# NSS is loaded into unrelated processes: no additional dynamic runtime,
# and no exported compiler-runtime symbols that could interpose on the caller.
python3 - "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libnss_peios.so.2" <<'PY_NSS'
import re, subprocess, sys
elf = sys.argv[1]
dynamic = subprocess.check_output(["readelf", "-dW", elf], text=True)
needed = set(re.findall(r"\(NEEDED\).*\[(.*?)\]", dynamic))
if needed != {"libc.so.6", "ld-linux-x86-64.so.2"}:
    raise SystemExit(f"{elf}: unexpected NSS dependencies {sorted(needed)}")
symbols = subprocess.check_output(["readelf", "--dyn-syms", "--wide", elf], text=True)
for line in symbols.splitlines():
    fields = line.split()
    if len(fields) >= 8 and fields[4] in {"GLOBAL", "WEAK"} and fields[6] != "UND":
        if not fields[7].startswith("_nss_peios_"):
            raise SystemExit(f"{elf}: unexpected NSS export {fields[7]}")
PY_NSS

# Installed-payload smoke: public client CLI, prohibited login bypass, NSS ABI,
# seed syntax, and live-account script syntax all come from staged files.
"$PEKIT_OUT/usr/bin/lps" --help > "$PEKIT_OUT/lps-help"
grep -q 'usage: lps' "$PEKIT_OUT/lps-help"
if "$PEKIT_OUT/usr/bin/login" -f peios >"$PEKIT_OUT/login-out" 2>"$PEKIT_OUT/login-err"; then
  echo 'authd: login unexpectedly accepted -f' >&2
  exit 1
fi
grep -q 'not supported' "$PEKIT_OUT/login-err"
readelf -Ws "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libnss_peios.so.2" |
  grep -q '_nss_peios_getpwnam_r'
python3 - "$PEKIT_OUT/usr/share/regim" <<'PY'
import json, pathlib, sys
root = pathlib.Path(sys.argv[1])
files = sorted(root.glob("*.reg"))
assert len(files) == 6, files
for path in files:
    value = json.loads(path.read_text())
    assert isinstance(value.get("keys"), list) and value["keys"], path

# These are security boundaries, not documentation: prove the shipped seeds
# retain exactly the authority each process needs and no SYSTEM defaults.
expected = {
    "authd-service.reg": [
        "SeChangeNotifyPrivilege", "SeCreateTokenPrivilege", "SeTcbPrivilege",
        "SeRestorePrivilege", "SeAuditPrivilege"
    ],
    "lpsd-service.reg": ["SeChangeNotifyPrivilege", "SeAuditPrivilege"],
    "login-console.reg": [
        "SeChangeNotifyPrivilege", "SeAssignPrimaryTokenPrivilege", "SeTcbPrivilege"
    ],
    "lpsd-first-account.reg": ["SeChangeNotifyPrivilege"],
}
for filename, privileges in expected.items():
    value = json.loads((root / filename).read_text())
    services = [key for key in value["keys"] if "\\Services\\" in key["path"]]
    assert len(services) == (4 if filename == "login-console.reg" else 1), (filename, services)
    for service in services:
        values = {entry["name"]: entry for entry in service.get("values", [])}
        required = values["RequiredPrivileges"]
        assert required["type"] == "multi", (filename, required)
        assert required["data"] == privileges, (filename, required["data"])
        if filename == "login-console.reg":
            assert values["Arguments"]["data"][0] == "--console"
            if service["path"].split("\\")[-1] != "login-console":
                assert values["Arguments"]["data"] == ["--console"]
PY
/usr/bin/sh -n "$PEKIT_OUT/usr/libexec/lpsd/first-account"
for manual in \
  "$PEKIT_OUT/usr/share/man/man1/lps.1.gz" \
  "$PEKIT_OUT/usr/share/man/man1/login.1.gz" \
  "$PEKIT_OUT/usr/share/man/man8/authd.8.gz" \
  "$PEKIT_OUT/usr/share/man/man8/lpsd.8.gz"
do
  gzip -t "$manual"
  gzip -cd "$manual" | grep '^\.TH ' >/dev/null
done
rm -f "$PEKIT_OUT/lps-help" "$PEKIT_OUT/login-out" "$PEKIT_OUT/login-err"
'''

[test.dependencies.peipkg]
"org.gnu.bash" = "*"
"org.gnu.tar" = "*"
"org.git.kernel.dash"         = "*"
"dev.peios.peiosutils"        = "*"
"org.gnu.findutils"           = "*"
"org.gnu.grep"                = "*"
"org.gnu.sed"                 = "*"
"org.gnu.gzip"                = "*"
"org.rust-lang.rust"          = ">= 1.98.1"
"org.pkgconf.pkgconf"         = "*"
"org.gnu.binutils"            = "*"
"org.sourceware.debugedit"    = "*"
"org.python.python3"          = "*"
"org.llvm.clang"              = ">= 22"
"dev.peios.libpeios-devel"    = ">= 0.5.8"
"dev.peios.kernel-headers"    = "*"
