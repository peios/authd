# authd — Peios's authentication authority and the independently deployable
# programs around it. One hermetic build produces trust-domain packages for
# the authority, local principal source, administration client, login client,
# NSS client, and the explicitly optional live-image account bootstrap.

out_dir = "out"

[source_package]
name = "dev.peios.authd-source"

[build.vendor]
command = '''
set -eu
SRC=$(pwd -P)
export CARGO_HOME=/tmp/cargo
export CARGO_NET_GIT_FETCH_WITH_CLI=true
mkdir -p "$CARGO_HOME" "$PEKIT_OUT"
cd "$SRC"
cargo vendor --locked "$PEKIT_OUT/vendor" > "$PEKIT_OUT/cargo-config.toml"
test -s "$PEKIT_OUT/cargo-config.toml"
test -n "$(find "$PEKIT_OUT/vendor" -mindepth 1 -maxdepth 1 -type d -print -quit)"

'''

[build.vendor.dependencies.peipkg]
"org.rust-lang.rust" = ">= 1.98.1"

[build.vendor.dependencies.apt]
cargo           = "*"
git             = "*"
ca-certificates = "*"

[build.main]
needs = ["vendor"]
command = '''
set -eu
set -o pipefail 2>/dev/null || true

SRC=$(pwd -P)
export CARGO_HOME="$PEKIT_OUT/cargo-home"
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"

for tool in cargo rustc gcc pkg-config python3 objcopy strip readelf debugedit; do
  command -v "$tool" >/dev/null || {
    echo "authd: missing required build tool: $tool" >&2
    exit 1
  }
done

# Production builds consume the packaged C ABI and an exact public peios-rs
# revision. No sibling checkout or mutable Cargo cache is visible here.
unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI
pkg-config --exists peios || {
  echo "authd: libpeios-devel (peios.pc) is required" >&2
  exit 1
}
export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"

# A release tag and every workspace crate describe the same source family.
# Refuse a wrapper version that would create plausible but falsely versioned
# artifacts.
cargo metadata --locked --offline --no-deps --format-version 1 |
  python3 -c '
import json, os, sys
metadata = json.load(sys.stdin)
members = set(metadata["workspace_members"])
versions = sorted({p["version"] for p in metadata["packages"] if p["id"] in members})
expected = os.environ["PEKIT_VERSION"]
if versions != [expected]:
    raise SystemExit(f"authd: workspace versions {versions!r} do not equal package version {expected!r}")
'

# Stable DWARF names keep checkout and build-root paths out of the binaries.
# Put broad mappings first so the more specific source/vendor mappings win.
export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$PEKIT_WORKSPACE_ROOT=/usr/src/debug/dev.peios.authd/.workspace --remap-path-prefix=$PEKIT_OUT_BASE=/usr/src/debug/dev.peios.authd/.build --remap-path-prefix=$SRC=/usr/src/debug/dev.peios.authd --remap-path-prefix=$PEKIT_VENDOR_OUT/vendor=/usr/src/debug/dev.peios.authd/vendor"

# The exact locked graph is exercised by the gated test target below.
cargo build --release --locked --offline \
  --bin authd --bin lpsd --bin lps --bin login \
  --target-dir "$PEKIT_OUT/target"
cargo build --release --locked --offline -p nss_peios --target-dir "$PEKIT_OUT/target"

mkdir -p "$PEKIT_OUT/usr/sbin" "$PEKIT_OUT/usr/bin"
cp "$PEKIT_OUT/target/release/authd" "$PEKIT_OUT/usr/sbin/authd"
cp "$PEKIT_OUT/target/release/lpsd" "$PEKIT_OUT/usr/sbin/lpsd"
cp "$PEKIT_OUT/target/release/login" "$PEKIT_OUT/usr/bin/login"
cp "$PEKIT_OUT/target/release/lps" "$PEKIT_OUT/usr/bin/lps"
test -x "$PEKIT_OUT/usr/sbin/authd"
test -x "$PEKIT_OUT/usr/sbin/lpsd"
test -x "$PEKIT_OUT/usr/bin/login"
test -x "$PEKIT_OUT/usr/bin/lps"

# Install deterministic compressed manual pages. Keeping these beside the
# source makes each public executable self-documenting without depending on
# generated help output or a networked documentation build.
mkdir -p "$PEKIT_OUT/usr/share/man/man1" "$PEKIT_OUT/usr/share/man/man8"
gzip -n -9 -c "$SRC/man/lps.1" > "$PEKIT_OUT/usr/share/man/man1/lps.1.gz"
gzip -n -9 -c "$SRC/man/login.1" > "$PEKIT_OUT/usr/share/man/man1/login.1.gz"
gzip -n -9 -c "$SRC/man/authd.8" > "$PEKIT_OUT/usr/share/man/man8/authd.8.gz"
gzip -n -9 -c "$SRC/man/lpsd.8" > "$PEKIT_OUT/usr/share/man/man8/lpsd.8.gz"

# glibc loads this exact NSS ABI name from its configured triplet libdir.
mkdir -p "$PEKIT_OUT/usr/lib/x86_64-linux-peios"
cp "$PEKIT_OUT/target/release/libnss_peios.so" \
  "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libnss_peios.so.2"
test -s "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libnss_peios.so.2"

# Registry seeds are inert vendor inputs. Keep the passwordless live-image
# bootstrap in its own package so the production principal source cannot
# introduce it merely by being installed.
mkdir -p "$PEKIT_OUT/usr/share/regim" "$PEKIT_OUT/usr/libexec/lpsd"
for seed in \
  lpsd-authd-registration.reg \
  authd-policy.reg \
  authd-service.reg \
  lpsd-service.reg \
  login-console.reg \
  lpsd-first-account.reg
do
  cp "$SRC/registry.d/$seed" "$PEKIT_OUT/usr/share/regim/$seed"
done
cp "$SRC/libexec/first-account" "$PEKIT_OUT/usr/libexec/lpsd/first-account"
test -x "$PEKIT_OUT/usr/libexec/lpsd/first-account"

# Split each independently installable ELF's symbols separately, while sharing
# one exact debug-source tree for the source release and vendored Rust closure.
: > "$PEKIT_OUT/.debug-sources"
split_debug() {
  component=$1
  elf=$2
  list="$PEKIT_OUT/.debug-$component"
  debugedit -b "$SRC" -d /usr/src/debug/dev.peios.authd -l "$list" -n "$elf"
  cat "$list" >> "$PEKIT_OUT/.debug-sources"
  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  [ -n "$build_id" ] || {
    echo "authd: $elf has no build ID" >&2
    exit 1
  }
  first=$(printf %s "$build_id" | cut -c1-2)
  rest=$(printf %s "$build_id" | cut -c3-)
  debug="$PEKIT_OUT/debug/$component/usr/lib/debug/.build-id/$first/$rest.debug"
  mkdir -p "$(dirname "$debug")"
  objcopy --only-keep-debug "$elf" "$debug"
  strip --strip-unneeded "$elf"
  objcopy --add-gnu-debuglink="$debug" "$elf"
  rm -f "$list"
}

split_debug authd "$PEKIT_OUT/usr/sbin/authd"
split_debug lpsd "$PEKIT_OUT/usr/sbin/lpsd"
split_debug lps "$PEKIT_OUT/usr/bin/lps"
split_debug login "$PEKIT_OUT/usr/bin/login"
split_debug nss "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libnss_peios.so.2"

DEBUG_ROOT="$PEKIT_OUT/usr/src/debug/dev.peios.authd"
mkdir -p "$DEBUG_ROOT"
tr '\0' '\n' < "$PEKIT_OUT/.debug-sources" | LC_ALL=C sort -u | while IFS= read -r rel; do
  [ -n "$rel" ] || continue
  case "$rel" in */) continue ;; esac
  case "$rel" in
    vendor/*) origin="$PEKIT_VENDOR_OUT/$rel" ;;
    *)        origin="$SRC/$rel" ;;
  esac
  [ -f "$origin" ] || continue
  mkdir -p "$DEBUG_ROOT/$(dirname "$rel")"
  cp "$origin" "$DEBUG_ROOT/$rel"
done
rm -f "$PEKIT_OUT/.debug-sources"
test -n "$(find "$DEBUG_ROOT" -type f -print -quit)"

'''

# authd alone is part of the Peios trusted computing base: it holds the two
# privileges that mint identity. The tier is selected by the signing key.
[build.main.sign.pip]
"usr/sbin/authd" = "tcb.priv"

[build.main.dependencies.peipkg]
"org.git.kernel.dash"         = "*"
"dev.peios.peiosutils"        = "*"
"org.gnu.findutils"           = "*"
"org.gnu.grep"                = "*"
"org.gnu.sed"                 = "*"
"org.gnu.gzip"                = "*"
"org.rust-lang.rust"          = ">= 1.98.1"
"org.pkgconf.pkgconf"         = "*"
"org.gnu.binutils"            = "*"
"org.sourceware.debugedit"    = "*"
"org.python.python3"          = "*"
"org.llvm.clang"              = ">= 22"
"dev.peios.libpeios-devel"    = "*"
"dev.peios.kernel-headers"    = "*"

[build.main.dependencies.apt]
dash         = "*"
coreutils    = "*"
findutils    = "*"
grep         = "*"
sed          = "*"
gzip         = "*"
cargo        = "*"
rustc        = "*"
gcc          = "*"
pkg-config   = "*"
libclang-dev = "*"
binutils     = "*"
debugedit    = "*"
python3      = "*"

[test]
gate = true
needs = ["main", "vendor"]
command = '''
set -eu
export CARGO_HOME="$PEKIT_OUT/cargo-home"
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"
unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI
pkg-config --exists peios || {
  echo "authd: libpeios-devel (peios.pc) is required" >&2
  exit 1
}
export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"
cargo test --release --workspace --locked --offline --target-dir "$PEKIT_OUT/target"

# Validate the exact staged package output produced by build.main.
SRC=$(pwd -P)
PEKIT_OUT="$PEKIT_MAIN_OUT"
# Fail closed on distribution hardening, split-debug, and path-leak policy.
for record in \
  "authd:$PEKIT_OUT/usr/sbin/authd:exe" \
  "lpsd:$PEKIT_OUT/usr/sbin/lpsd:exe" \
  "lps:$PEKIT_OUT/usr/bin/lps:exe" \
  "login:$PEKIT_OUT/usr/bin/login:exe" \
  "nss:$PEKIT_OUT/usr/lib/x86_64-linux-peios/libnss_peios.so.2:dso"
do
  component=${record%%:*}
  remain=${record#*:}
  elf=${remain%:*}
  kind=${record##*:}

  readelf -h "$elf" | grep -Eq 'Type:[[:space:]]+DYN'
  readelf -lW "$elf" | grep -q 'GNU_RELRO'
  readelf -lW "$elf" | grep -Eq 'GNU_STACK[[:space:]].*RW[[:space:]]'
  readelf -dW "$elf" | grep -q 'BIND_NOW'
  readelf -dW "$elf" | grep -q 'RELR'
  ! readelf -dW "$elf" | grep -Eq '(RPATH|RUNPATH)'
  ! readelf -SW "$elf" | grep -q '\.debug_info'
  if [ "$kind" = exe ]; then
    readelf -dW "$elf" | grep -Eq 'FLAGS_1.*PIE'
  else
    readelf -dW "$elf" | grep -Fq 'Library soname: [libnss_peios.so.2]'
  fi

  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  debug="$PEKIT_OUT/debug/$component/usr/lib/debug/.build-id/$(printf %s "$build_id" | cut -c1-2)/$(printf %s "$build_id" | cut -c3-).debug"
  test -s "$debug"
  readelf -SW "$debug" | grep -q '\.debug_info'
  test "$(readelf -n "$debug" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)" = "$build_id"
  for forbidden in "$SRC" "$PEKIT_VENDOR_OUT" "$PEKIT_OUT_BASE" "$PEKIT_WORKSPACE_ROOT"; do
    ! grep -aF "$forbidden" "$elf" "$debug" >/dev/null
  done
done

# Installed-payload smoke: public client CLI, prohibited login bypass, NSS ABI,
# seed syntax, and live-account script syntax all come from staged files.
"$PEKIT_OUT/usr/bin/lps" --help > "$PEKIT_OUT/lps-help"
grep -q 'usage: lps' "$PEKIT_OUT/lps-help"
if "$PEKIT_OUT/usr/bin/login" -f peios >"$PEKIT_OUT/login-out" 2>"$PEKIT_OUT/login-err"; then
  echo 'authd: login unexpectedly accepted -f' >&2
  exit 1
fi
grep -q 'not supported' "$PEKIT_OUT/login-err"
readelf -Ws "$PEKIT_OUT/usr/lib/x86_64-linux-peios/libnss_peios.so.2" |
  grep -q '_nss_peios_getpwnam_r'
python3 - "$PEKIT_OUT/usr/share/regim" <<'PY'
import json, pathlib, sys
root = pathlib.Path(sys.argv[1])
files = sorted(root.glob("*.reg"))
assert len(files) == 6, files
for path in files:
    value = json.loads(path.read_text())
    assert isinstance(value.get("keys"), list) and value["keys"], path

# These are security boundaries, not documentation: prove the shipped seeds
# retain exactly the authority each process needs and no SYSTEM defaults.
expected = {
    "authd-service.reg": [
        "SeChangeNotifyPrivilege", "SeCreateTokenPrivilege", "SeTcbPrivilege"
    ],
    "lpsd-service.reg": ["SeChangeNotifyPrivilege"],
    "login-console.reg": [
        "SeChangeNotifyPrivilege", "SeAssignPrimaryTokenPrivilege"
    ],
    "lpsd-first-account.reg": ["SeChangeNotifyPrivilege"],
}
for filename, privileges in expected.items():
    value = json.loads((root / filename).read_text())
    services = [key for key in value["keys"] if "\\Services\\" in key["path"]]
    assert len(services) == 1, (filename, services)
    values = {entry["name"]: entry for entry in services[0].get("values", [])}
    required = values["RequiredPrivileges"]
    assert required["type"] == "multi", (filename, required)
    assert required["data"] == privileges, (filename, required["data"])
PY
/usr/bin/sh -n "$PEKIT_OUT/usr/libexec/lpsd/first-account"
for manual in \
  "$PEKIT_OUT/usr/share/man/man1/lps.1.gz" \
  "$PEKIT_OUT/usr/share/man/man1/login.1.gz" \
  "$PEKIT_OUT/usr/share/man/man8/authd.8.gz" \
  "$PEKIT_OUT/usr/share/man/man8/lpsd.8.gz"
do
  gzip -t "$manual"
  gzip -cd "$manual" | grep '^\.TH ' >/dev/null
done
rm -f "$PEKIT_OUT/lps-help" "$PEKIT_OUT/login-out" "$PEKIT_OUT/login-err"
'''

[test.dependencies.peipkg]
"org.git.kernel.dash"         = "*"
"dev.peios.peiosutils"        = "*"
"org.gnu.findutils"           = "*"
"org.gnu.grep"                = "*"
"org.gnu.sed"                 = "*"
"org.gnu.gzip"                = "*"
"org.rust-lang.rust"          = ">= 1.98.1"
"org.pkgconf.pkgconf"         = "*"
"org.gnu.binutils"            = "*"
"org.sourceware.debugedit"    = "*"
"org.python.python3"          = "*"
"org.llvm.clang"              = ">= 22"
"dev.peios.libpeios-devel"    = "*"
"dev.peios.kernel-headers"    = "*"

[test.dependencies.apt]
dash         = "*"
coreutils    = "*"
findutils    = "*"
grep         = "*"
sed          = "*"
gzip         = "*"
cargo        = "*"
