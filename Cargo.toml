[workspace]
resolver = "2"
members = ["libauthd", "libauthd-client", "libauthd-policy", "libtty", "libsession", "authd", "lpsd", "lps", "login", "nss"]

# authd is its own workspace root, like peios-rs and libpeios.
#
# Members, and the trust boundaries between them:
#
#   libauthd  the wire protocols. No I/O, no policy, no privilege.
#   libauthd-client
#             clients of lpsd's admin socket and authd's identity socket,
#             for the programs that ask: lps, nss, the userland's ls and the
#             GUI apps. std and libauthd alone. No daemon links it.
#   libauthd-policy
#             what this machine grants a principal, read from the registry,
#             and the well-known principals. authd mints from it; Principals
#             Manager shows it, and edits it with the `write` feature, which
#             authd never turns on.
#   authd     the daemon. Runs at PeiosTcb with SeCreateTokenPrivilege.
#   lpsd      the local principal source. Owns the local identity bytes.
#   lps       administers lpsd's store, over a socket. Owns nothing.
#   login     /bin/login. Runs as LogonService.
#   nss       libnss_peios.so.2. Loaded into every process on the system, so
#             it depends on libauthd, libauthd-client and libc, and nothing
#             else; it asks the identity socket as every other program does.
#
# libtty is the exception that proves the rule: not a trust domain but a
# utility, shared by login and lps because both must read a password from a
# terminal and neither should own a second copy of the termios guard.
# libsession likewise shares user-session preferences between console, SSH
# and GXWI originators; authentication daemons do not depend on it.
#
# Each daemon is a separate crate *because* each sits in a separate trust
# domain: sharing a crate would make it easy to share code across a boundary by
# accident. libauthd is the only thing they are permitted to depend on, and it
# is deliberately inert — types and a codec, nothing that can act.
# libauthd-policy is authd's own policy reading, lifted out so that a window
# showing what a principal gets reads it the way authd does; it reads, and
# without `write` cannot change anything.
#
# The three-way split is the shape the whole design rests on. authd can mint but
# cannot verify; lpsd can verify but cannot mint; login can do neither and
# merely collects. Compromising lpsd yields the material an offline attack is
# run against, not the ability to issue identity.
