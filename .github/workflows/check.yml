name: Authd build and tests

on:
    pull_request:
    push:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: authd-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false
            - name: Install Linux development tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential libclang-dev pkg-config python3 binutils
                  rustup toolchain install 1.96.0 --profile minimal
            - name: Check out the native SDK library
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  repository: peios/libpeios
                  ref: 3f2ce51c7cfc27644f72a053ca01888736905064
                  path: .ci-sdk/libpeios
                  persist-credentials: false
            - name: Check out the kernel UAPI
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  repository: peios/kernel
                  ref: 9759ae740f2a194e8f7c63dd7d88cd31604bf044
                  path: .ci-sdk/kernel
                  sparse-checkout: include/uapi/pkm
                  persist-credentials: false
            - name: Prepare the development SDK
              run: tools/prepare-dev-sdk .ci-sdk/libpeios .ci-sdk/kernel/include/uapi "$RUNNER_TEMP/peios-sdk"
            - name: Build and test
              env:
                  PEIOS_SDK: ${{ runner.temp }}/peios-sdk
              run: ./bazel test //...
            - name: Verify SDK-only builds need no Peios SDK
              run: ./bazel test //libauth:tests //peios-auth:client-test //:abi-test
