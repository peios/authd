[package]
name = "lps"
version = "0.0.24"
edition = "2024"
license = "MIT"
description = "Administer Peios' local principal store."
publish = false

[[bin]]
name = "lps"
path = "src/main.rs"

# A client and nothing more. It holds no state, reads no store, and has no
# privilege of its own — everything it does is a request lpsd decides whether to
# honour, which is why the store's descriptor can stay as narrow as it is.
[dependencies]
auth-core = { path = "../auth-core", features = ["client"] }
terminal-input = { path = "../terminal-input" }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "b2282f654758831e4a2e34c7b35c26e61a6ebe1c" }
